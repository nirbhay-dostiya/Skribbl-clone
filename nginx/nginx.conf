# ─── Nginx reverse proxy for Skribbl Clone ────────────────────────────────
#
# Handles:
#   - React SPA static files       (/**)
#   - Spring Boot REST API         (/api/**)
#   - Spring Boot WebSocket/STOMP  (/ws/**)  ← needs upgrade headers
# ─────────────────────────────────────────────────────────────────────────

upstream backend {
    server localhost:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name _;           # catches any hostname / IP

    # ── React SPA static files ───────────────────────────────────
    root /var/www/skribbl;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Cache-bust: aggressive caching for hashed assets, no-cache for index.html
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── REST API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket / STOMP ────────────────────────────────────────
    # SockJS starts with /ws, then upgrades to WebSocket
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;

        # These two headers are REQUIRED for WebSocket upgrade
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Keep WebSocket connections alive for the full game session
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── React SPA fallback (client-side routing) ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
