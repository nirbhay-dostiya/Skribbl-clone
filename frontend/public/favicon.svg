<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Pencil body -->
  <polygon points="10,54 16,60 58,18 52,12" fill="#f5a623" stroke="#d4891a" stroke-width="1.5"/>
  <!-- Pencil tip (wood) -->
  <polygon points="10,54 16,60 13,63 7,57" fill="#e8c18a" stroke="#d4891a" stroke-width="1.5"/>
  <!-- Pencil lead tip -->
  <polygon points="7,57 13,63 11,65 5,59" fill="#444444"/>
  <!-- Pencil top eraser band -->
  <polygon points="52,12 58,18 62,14 56,8" fill="#ef9a9a" stroke="#e57373" stroke-width="1"/>
  <!-- Pencil stripe (ferrule) -->
  <polygon points="50,10 56,16 58,14 52,8" fill="#9e9e9e" stroke="#757575" stroke-width="1"/>
  <!-- Pencil highlight -->
  <polygon points="14,20 20,14 54,14 58,18 22,18" fill="rgba(255,255,255,0.18)"/>
</svg>