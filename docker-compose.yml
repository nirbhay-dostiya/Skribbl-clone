version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: skribbl_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Developer2005@Nirbhay"
      MYSQL_DATABASE: skribbl
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pDeveloper2005@Nirbhay"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
